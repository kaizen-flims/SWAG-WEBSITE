<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>#SWAG — Instant Stream. No Compromise.</title>
  <meta name="description" content="A modern Free Streaming Service using plugins to stream, nothing is being streamed in our servers." />
  <meta name="theme-color" content="#000000" />
  <style>
    :root {
      --bg: #000000;
      --card-bg: #0b0b0d;
      --card-border: rgba(255, 255, 255, 0.085);
      --text-primary: #f5f5f7;
      --text-muted: rgba(255, 255, 255, 0.54);
      --text-dim: rgba(255, 255, 255, 0.38);
      --pill-primary-bg: #f5f5f7;
      --pill-primary-fg: #000000;
      --pill-secondary-bg: rgba(255, 255, 255, 0.05);
      --pill-secondary-border: rgba(255, 255, 255, 0.14);
      --badge-bg: rgba(255, 255, 255, 0.56);
      --badge-fg: #09090b;
      --max-w: 980px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Sticky Top Navbar (BitChord exact glass style, Clean Brand Header) */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
      background: rgba(0, 0, 0, 0.76);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .top-nav-inner {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: opacity 0.2s ease;
    }

    .brand-link:hover {
      opacity: 0.85;
    }

    .nav-wordmark {
      height: 26px;
      width: auto;
      display: block;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .nav-gh-link {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.03);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .nav-gh-link:hover {
      color: var(--text-primary);
      border-color: rgba(255, 255, 255, 0.24);
      background: rgba(255, 255, 255, 0.08);
    }

    /* Main Container */
    .page-wrap {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 16px 16px 48px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* 1. Hero Section Card */
    .hero-card {
      position: relative;
      background: radial-gradient(120% 85% at 50% 72%, rgba(168, 102, 38, 0.34) 0%, rgba(92, 52, 18, 0.20) 42%, rgba(12, 12, 14, 0.96) 85%, #0a0a0c 100%);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 46px 22px 0;
      text-align: center;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
    }

    .hero-headline {
      font-size: clamp(32px, 7.2vw, 52px);
      line-height: 1.08;
      font-weight: 700;
      letter-spacing: -0.035em;
      margin-bottom: 28px;
    }

    .hero-headline .bright {
      display: block;
      color: #ffffff;
    }

    .hero-headline .muted {
      display: block;
      color: rgba(255, 255, 255, 0.55);
    }

    .cta-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 36px;
      position: relative;
      z-index: 3;
    }

    .btn-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      height: 48px;
      padding: 0 26px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), background 0.2s ease, border-color 0.2s ease;
      cursor: pointer;
      user-select: none;
    }

    .btn-pill:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--pill-primary-bg);
      color: var(--pill-primary-fg);
      min-width: 215px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .btn-primary:hover {
      background: #ffffff;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.04);
      color: #ffffff;
      border: 1px solid var(--pill-secondary-border);
      min-width: 190px;
      backdrop-filter: blur(12px);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.28);
      transform: translateY(-1px);
    }

    .btn-icon {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
    }

    /* Phone Bezel Video Container inside Hero */
    .hero-phone-stage {
      position: relative;
      width: min(100%, 336px);
      margin: 0 auto;
      padding-top: 6px;
    }

    .phone-bezel {
      position: relative;
      width: 100%;
      aspect-ratio: 480 / 880;
      max-height: 540px;
      margin: 0 auto -36px;
      border-radius: 40px 40px 0 0;
      padding: 10px 10px 0;
      background: linear-gradient(180deg, #2a241e 0%, #151311 40%, #0d0c0b 100%);
      border: 1.5px solid rgba(255, 225, 190, 0.18);
      border-bottom: none;
      box-shadow:
        0 -12px 50px rgba(212, 132, 52, 0.22),
        0 20px 50px rgba(0, 0, 0, 0.85),
        inset 0 1px 1px rgba(255, 255, 255, 0.22);
      overflow: hidden;
    }

    .phone-screen {
      width: 100%;
      height: 100%;
      border-radius: 31px 31px 0 0;
      overflow: hidden;
      background: #000000;
      position: relative;
    }

    .hero-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
      background: #000;
    }

    .hero-bottom-fade {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 68px;
      background: linear-gradient(180deg, rgba(10, 10, 12, 0) 0%, rgba(10, 10, 12, 0.88) 78%, #0a0a0c 100%);
      pointer-events: none;
      z-index: 4;
    }

    /* 2. Two-Card Profile Stats Slider Section (Taste DNA + Watch Time ~69h) */
    .feature-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 38px 20px 28px;
      overflow: hidden;
    }

    .feature-header {
      text-align: center;
      max-width: 480px;
      margin: 0 auto 28px;
    }

    .feature-title {
      font-size: clamp(20px, 4.5vw, 26px);
      font-weight: 600;
      letter-spacing: -0.025em;
      color: #ffffff;
      margin-bottom: 10px;
    }

    .feature-sub {
      font-size: 14.5px;
      line-height: 1.48;
      color: var(--text-muted);
      font-weight: 400;
    }

    .stats-slider-viewport {
      position: relative;
      width: 100%;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      display: flex;
      gap: 14px;
      padding: 4px 6% 10px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .stats-slider-viewport::-webkit-scrollbar {
      display: none;
    }

    .stats-slide {
      flex: 0 0 88%;
      max-width: 520px;
      scroll-snap-align: center;
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.09);
      background: #121214;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.55);
      transition: transform 0.3s ease, border-color 0.3s ease;
      cursor: pointer;
    }

    @media (min-width: 720px) {
      .stats-slider-viewport {
        padding: 4px 12% 10px;
        gap: 20px;
      }
      .stats-slide {
        flex: 0 0 76%;
      }
    }

    .stats-slide.active-slide {
      border-color: rgba(255, 255, 255, 0.18);
    }

    .stats-slide-img {
      width: 100%;
      height: auto;
      aspect-ratio: 926 / 611;
      object-fit: cover;
      display: block;
    }

    .slider-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      margin-top: 18px;
    }

    .slider-arrow {
      background: transparent;
      border: none;
      color: #ffffff;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.2s ease, background 0.2s ease;
    }

    .slider-arrow:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.08);
    }

    .slider-arrow:disabled {
      opacity: 0.26;
      cursor: default;
    }

    /* 3. Media Poster Sliders (Best of 2026, Critically Acclaimed Movies, Critically Acclaimed Series) */
    .media-section {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-top: 4px;
    }

    .section-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
    }

    .section-heading {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    .section-nav-btns {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sec-arrow {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      color: rgba(255, 255, 255, 0.8);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .sec-arrow:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }

    /* Best of 2026: 4-Row Horizontal Grid Slider (matches BitChord's Best New Songs 1:1) */
    .songs-grid-slider {
      display: grid;
      grid-template-rows: repeat(4, auto);
      grid-auto-flow: column;
      grid-auto-columns: min(82vw, 310px);
      column-gap: 20px;
      row-gap: 0;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding: 2px 4px 6px;
    }

    .songs-grid-slider::-webkit-scrollbar {
      display: none;
    }

    .song-row {
       scroll-snap-align: start;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      transition: opacity 0.18s ease;
    }

    .song-row:hover {
      opacity: 0.84;
    }

    .song-thumb {
      width: 50px;
      height: 50px;
      border-radius: 9px;
      object-fit: cover;
      background: #18181b;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .song-meta {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .song-title-line {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .song-title {
      font-size: 14.5px;
      font-weight: 500;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-sub {
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rating-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.55);
      color: #000000;
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 0.02em;
      line-height: 1.25;
      flex-shrink: 0;
      text-transform: uppercase;
    }

    /* Critically Acclaimed Movies & Series: Horizontal Poster Sliders (matches BitChord's New This Week & Recent Releases) */
    .poster-row-slider {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding: 2px 4px 8px;
    }

    .poster-row-slider::-webkit-scrollbar {
      display: none;
    }

    .media-card {
      flex: 0 0 156px;
      width: 156px;
      scroll-snap-align: start;
      display: flex;
      flex-direction: column;
      gap: 7px;
      transition: transform 0.2s ease;
    }

    @media (min-width: 640px) {
      .media-card {
        flex: 0 0 176px;
        width: 176px;
      }
    }

    .media-card:hover {
      transform: translateY(-3px);
    }

    .media-art-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 14px;
      overflow: hidden;
      background: #141417;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
    }

    .media-art {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    .media-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      margin-top: 2px;
    }

    .media-title {
      font-size: 14px;
      font-weight: 500;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .media-sub {
      font-size: 12.5px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: -3px;
    }

    /* 4. Bottom Statement CTA Card */
    .bottom-cta-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 52px 24px 48px;
      text-align: center;
      margin-top: 8px;
    }

    .bottom-cta-text {
      max-width: 560px;
      margin: 0 auto 32px;
      font-size: clamp(23px, 5.4vw, 34px);
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .bottom-cta-text .bright {
      color: #ffffff;
    }

    .bottom-cta-text .muted {
      color: rgba(255, 255, 255, 0.48);
    }

    .bottom-cta-card .cta-stack {
      margin-bottom: 0;
    }

    /* 5. Footer */
    .site-footer {
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      margin-top: 8px;
      padding: 34px 20px 48px;
    }

    .site-footer-inner {
      max-width: var(--max-w);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .footer-brand {
      display: inline-flex;
      align-items: center;
    }

    .footer-wordmark {
      height: 24px;
      width: auto;
      display: block;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 18px;
      font-size: 13.5px;
      color: var(--text-muted);
    }

    .footer-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      transition: color 0.18s ease;
    }

    .footer-link:hover {
      color: #ffffff;
    }

    .footer-disclaimer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 12px;
      line-height: 1.55;
      color: var(--text-dim);
      max-width: 680px;
    }

    .footer-credit {
      font-size: 12.5px;
      font-style: italic;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .footer-credit a {
      color: var(--text-primary);
      text-decoration: none;
    }

    .footer-credit a:hover {
      text-decoration: underline;
    }
  </style>
</head>
