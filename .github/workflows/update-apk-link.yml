name: Update Download Link to APK

on:
  push:
    paths:
      - '.github/workflows/update-apk-link.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-link:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Replace zip download link with SWAG-UNIVERSAL.apk in index.html
        run: |
          python3 - << 'PYEOF'
          with open("index.html", "r", encoding="utf-8") as f:
              html = f.read()
          html = html.replace("swag-universal-release.1.zip", "SWAG-UNIVERSAL.apk")
          with open("index.html", "w", encoding="utf-8") as f:
              f.write(html)
          PYEOF
          git config user.name "kaizen-flims"
          git config user.email "kaizen-flims@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: update v1.0.0 download link to SWAG-UNIVERSAL.apk"
          git push origin HEAD:main
